name: CI - Inventario Hospitalar

on:
  push:
    branches: [main, revisao-tecnica]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install gradio pytest coverage

      - name: Executar testes
        run: python -m pytest -v

      - name: Calcular cobertura
        run: python -m coverage run --source=app -m pytest

      - name: Exibir relatorio
        run: python -m coverage report -m
